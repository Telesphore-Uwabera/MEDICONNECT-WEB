[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_APP_BASE_URL = "/api/v1"
  VITE_REVERB_APP_KEY = "mediconnect-staging-key"
  # Rollback: the tunnel resets WebSocket handshakes, so the client ignored this host.
  # VITE_REVERB_HOST = "makers-chip-laboratories-maintains.trycloudflare.com"
  # Direct server. The certificate matches this name. Do not use the bare IP.
  VITE_REVERB_HOST = "ws.mediconnect.rw"
  VITE_REVERB_PORT = "443"
  VITE_REVERB_SCHEME = "wss"
  VITE_DEV = "false"

# api.mediconnect.rw and ws.mediconnect.rw resolve to the server, not this site.
# Do not redirect those hostnames here: the rules would never run, and a rule
# that sent them back to the same name would loop. db.mediconnect.rw is still a
# Netlify hostname, so only that console stays proxied through the tunnel.
[[redirects]]
  from = "https://db.mediconnect.rw/*"
  to = "https://makers-chip-laboratories-maintains.trycloudflare.com/__host/db/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://db.mediconnect.rw/"
  to = "https://makers-chip-laboratories-maintains.trycloudflare.com/__host/db/"
  status = 200
  force = true

# Same-origin API used by the website.
# Rollback: tunnel in front of the Node server.
# [[redirects]]
#   from = "/api/v1/*"
#   to = "https://makers-chip-laboratories-maintains.trycloudflare.com/api/v1/:splat"
#   status = 200
#   force = true
[[redirects]]
  from = "/api/*"
  to = "https://api.mediconnect.rw/api/:splat"
  status = 200
  force = true

# Uploaded files. The API host serves /storage (nginx) and /minio (the Node app).
# Rollback: tunnel.
# [[redirects]]
#   from = "/storage/*"
#   to = "https://makers-chip-laboratories-maintains.trycloudflare.com/storage/:splat"
#   status = 200
#   force = true
[[redirects]]
  from = "/storage/*"
  to = "https://api.mediconnect.rw/storage/:splat"
  status = 200
  force = true

# Rollback: tunnel.
# [[redirects]]
#   from = "/minio/*"
#   to = "https://makers-chip-laboratories-maintains.trycloudflare.com/minio/:splat"
#   status = 200
#   force = true
[[redirects]]
  from = "/minio/*"
  to = "https://api.mediconnect.rw/minio/:splat"
  status = 200
  force = true

# Known app routes stay 200 so a refresh of a real page is not a missing document.
# Anything else still serves the app (so the React 404 screen can render) but with HTTP 404.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/index.html"
  status = 200

