[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_APP_BASE_URL = "/api/v1"
  VITE_REVERB_APP_KEY = "mediconnect-staging-key"
  VITE_REVERB_HOST = "ws.mediconnect.rw"
  VITE_REVERB_PORT = "443"
  VITE_REVERB_SCHEME = "wss"
  VITE_DEV = "false"

# Browser talks to Netlify; Netlify proxies to the Laravel backend.
# Using HTTP via public IP until SSL certs are issued on the new server.
[[redirects]]
  from = "/api/v1/*"
  to = "http://197.243.29.114/api/v1/:splat"
  status = 200
  force = true
  host = "api.mediconnect.rw"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
