[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_APP_BASE_URL = "/api/v1"
  VITE_REVERB_APP_KEY = "mediconnect-staging-key"
  # Direct server. The certificate matches this name. Do not use the bare IP.
  # The old Cloudflare tunnel (makers-chip-laboratories-maintains.trycloudflare.com)
  # is shut down and is not a host or proxy target.
  VITE_REVERB_HOST = "ws.mediconnect.rw"
  VITE_REVERB_PORT = "443"
  VITE_REVERB_SCHEME = "wss"
  VITE_DEV = "false"

# api.mediconnect.rw and ws.mediconnect.rw resolve to the server. The database
# console is VPN-only, so this site does not redirect db.mediconnect.rw.
# Same-origin API used by the website.
[[redirects]]
  from = "/api/*"
  to = "https://api.mediconnect.rw/api/:splat"
  status = 200
  force = true

# Uploaded files. The API host serves /storage (nginx) and /minio (the Node app).
[[redirects]]
  from = "/storage/*"
  to = "https://api.mediconnect.rw/storage/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/minio/*"
  to = "https://api.mediconnect.rw/minio/:splat"
  status = 200
  force = true

# Known app routes stay 200 so a refresh of a real page is not a missing document.
# Anything else still serves the app (so the React 404 screen can render) but with HTTP 404.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/index.html"
  status = 200

