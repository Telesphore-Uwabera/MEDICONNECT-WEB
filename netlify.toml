[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_APP_BASE_URL = "/api/v1"
  VITE_REVERB_APP_KEY = "mediconnect-staging-key"
  VITE_REVERB_HOST = "ws.mediconnect.rw"
  VITE_REVERB_PORT = "443"
  VITE_REVERB_SCHEME = "wss"
  VITE_DEV = "false"

# Forward /api/v1/* to the Laravel backend on api.mediconnect.rw.
# Netlify rewrites the path so the backend receives /api/v1/:splat.
[[redirects]]
  from = "/api/v1/*"
  to = "http://api.mediconnect.rw/api/v1/:splat"
  status = 200
  force = true

# Forward /storage/* to the backend so uploaded files (images, docs) are served.
[[redirects]]
  from = "/storage/*"
  to = "http://api.mediconnect.rw/storage/:splat"
  status = 200
  force = true

# Forward /minio/* to MinIO so avatars and doctor images are served.
[[redirects]]
  from = "/minio/*"
  to = "http://api.mediconnect.rw/minio/:splat"
  status = 200
  force = true

# SPA fallback – must be last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
