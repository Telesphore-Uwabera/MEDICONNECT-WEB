[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_APP_BASE_URL = "/api/v1"
  VITE_REVERB_APP_KEY = "mediconnect-staging-key"
  VITE_REVERB_HOST = "makers-chip-laboratories-maintains.trycloudflare.com"
  VITE_REVERB_PORT = "443"
  VITE_REVERB_SCHEME = "wss"
  VITE_DEV = "false"

# The public addresses for the API, database console, and WebSocket are served
# by this site and forwarded to Node on 10.10.141.149. Node then shows the API,
# phpMyAdmin, or the WebSocket page based on the original hostname.
[[redirects]]
  from = "https://api.mediconnect.rw/*"
  to = "https://makers-chip-laboratories-maintains.trycloudflare.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://api.mediconnect.rw/"
  to = "https://makers-chip-laboratories-maintains.trycloudflare.com/"
  status = 200
  force = true

[[redirects]]
  from = "https://ws.mediconnect.rw/*"
  to = "https://makers-chip-laboratories-maintains.trycloudflare.com/__host/ws/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://ws.mediconnect.rw/"
  to = "https://makers-chip-laboratories-maintains.trycloudflare.com/__host/ws/"
  status = 200
  force = true

[[redirects]]
  from = "https://db.mediconnect.rw/*"
  to = "https://makers-chip-laboratories-maintains.trycloudflare.com/__host/db/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://db.mediconnect.rw/"
  to = "https://makers-chip-laboratories-maintains.trycloudflare.com/__host/db/"
  status = 200
  force = true

# Same-origin API used by the website.
[[redirects]]
  from = "/api/v1/*"
  to = "https://makers-chip-laboratories-maintains.trycloudflare.com/api/v1/:splat"
  status = 200
  force = true

# Forward /storage/* to the backend so uploaded files (images, docs) are served.
[[redirects]]
  from = "/storage/*"
  to = "http://api.mediconnect.rw/storage/:splat"
  status = 200
  force = true

# Forward /minio/* to MinIO so avatars and doctor images are served.
[[redirects]]
  from = "/minio/*"
  to = "http://api.mediconnect.rw/minio/:splat"
  status = 200
  force = true

# Known app routes stay 200 so a refresh of a real page is not a missing document.
# Anything else still serves the app (so the React 404 screen can render) but with HTTP 404.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/patient/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/doctor"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/doctor/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/hospital"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/hospital/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/pharmacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/pharmacy/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/help"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/delete-account"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/onboarding/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/consultation/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/verify-certificate"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/fitness-certificates/*"
  to = "/index.html"
  status = 200

# SPA fallback for unknown paths – must be last. Status 404 so a missing URL is not HTTP 200.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
