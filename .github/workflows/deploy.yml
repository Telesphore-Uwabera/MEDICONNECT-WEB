name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger server deploy
    runs-on: ubuntu-latest

    steps:
      - name: Notify server to pull and restart
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          for i in 1 2 3; do
            RESPONSE=$(curl -s -o /tmp/deploy_resp.txt -w "%{http_code}" \
              -X POST https://api.mediconnect.rw/api/v1/deploy \
              -H "Authorization: Bearer ${DEPLOY_SECRET}" \
              --max-time 60 \
              --retry 2 \
              --retry-delay 5)
            echo "Attempt $i — HTTP status: $RESPONSE"
            cat /tmp/deploy_resp.txt || true
            if [ "$RESPONSE" = "202" ]; then
              echo "Deploy triggered successfully"
              exit 0
            fi
            sleep 10
          done
          echo "All attempts failed"
          exit 1
