name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy server files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Copy server files and restart via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 197.243.29.114
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 120s
          script: |
            cd /opt/mediconnect-node
            git -C /tmp/mediconnect-deploy fetch --depth=1 origin main 2>/dev/null || \
              git clone --depth=1 --branch main https://github.com/Telesphore-Uwabera/MEDICONNECT-WEB.git /tmp/mediconnect-deploy
            git -C /tmp/mediconnect-deploy reset --hard origin/main
            cp -r /tmp/mediconnect-deploy/server/src/* /opt/mediconnect-node/src/
            systemctl restart mediconnect-node
            sleep 4
            systemctl is-active mediconnect-node && echo "DEPLOY SUCCESS" || echo "DEPLOY FAILED"
