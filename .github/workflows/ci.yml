name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Unit, lint, build, and smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint changed TypeScript
        run: |
          git fetch origin main
          files=$(git diff --name-only --diff-filter=ACMR origin/main HEAD -- '*.ts' '*.tsx')
          if [ -z "$files" ]; then
            echo "No TypeScript files changed against main."
            exit 0
          fi
          echo "$files"
          npx eslint $files

      - name: Production build
        run: npm run build
        env:
          VITE_APP_BASE_URL: http://127.0.0.1:4173/api/v1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke
        run: npm run test:e2e
        env:
          CI: true
          VITE_APP_BASE_URL: http://127.0.0.1:4173/api/v1
